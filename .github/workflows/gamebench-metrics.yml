name: Generate gameBench metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run metrics
      - uses: actions/upload-artifact@v7
        with:
          name: gamebench-metrics
          path: metrics.json
          if-no-files-found: error
